<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos de Revenda</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mut:#6b7280;--pri:#2563eb;--bd:#e3e6ea;--err:#dc2626;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mut:#9aa1ad;--pri:#5b8cff;--bd:#2a2e36;--err:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:17px;margin:0 0 10px}
.s{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer;width:100%;margin-top:14px}
button.g{background:transparent;color:var(--pri);border:1px solid var(--bd);width:auto;margin:0;padding:6px 12px;font-size:13px}
button.d{color:var(--err)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{margin:0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.msg{font-size:13px;margin-top:10px;min-height:16px;color:var(--err)}.msg.ok{color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.bd{font-size:11px;background:var(--pri);color:#fff;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr;gap:0 12px}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 110px}}
.sum{display:flex;gap:10px;margin-bottom:16px}.sum div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:12px;color:var(--mut)}.sum b{display:block;font-size:20px;color:var(--tx)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar select{width:auto;flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;border-top:0}
td select{width:auto;padding:5px 8px;font-size:13px}
.pr{font-size:14px;margin-top:10px;color:var(--mut)}.pr b{color:var(--tx)}
.empty{color:var(--mut);text-align:center;padding:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURE AQUI (Supabase > Project Settings > API) ===== */
var SUPABASE_URL='https://lnetdehrdbduhibuwgiz.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZXRkZWhyZGJkdWhpYnV3Z2l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTk4MDgsImV4cCI6MjEwNjE5NTgwOH0.dzpYwnP5F-KZIOEe_H-C_99BiV6oX4fD0xEKnScc6gk';
/* =============================================================== */
var CAT=[
['Linha Pet – Camas',[['Cama P – Normal',39],['Cama P – Impermeável',41],['Cama M – Normal',48],['Cama M – Impermeável',57],['Cama G – Normal',56],['Cama G – Impermeável',66],['Cama Retangular 70x80 – Normal',66],['Cama Retangular 70x80 – Impermeável',78],['Cama GG – Normal',72],['Cama GG – Impermeável',88],['Cama Redonda',25.5]]],
['Tapetes e Edredons Pet',[['Tapete de Ossinho P',10],['Tapete de Ossinho GG',14],['Edredom P',23.5],['Edredom GG',36],['Edredom + Tapete P',33],['Edredom + Tapete GG',48],['Manta',10]]],
['Colchão Impermeável',[['Colchão 50x60 (1 Capa)',33],['Colchão 50x60 (2 Capas)',41],['Colchão 65x95 (1 Capa)',63],['Colchão 65x95 (2 Capas)',72],['Colchão 70x1m (1 Capa)',72],['Colchão 70x1m (2 Capas)',84]]],
['Colchão Simples',[['Colchão Simples N5',27],['Colchão Simples N4',21],['Colchão Simples N3',16.8],['Colchão Simples N1',11.5]]],
['Toalhas de Natal',[['Toalha de Natal 4 lugares',16.5],['Toalha de Natal 6 lugares',22.8],['Toalha de Natal 8 lugares',27.5]]]
];
var PRICE={};CAT.forEach(function(g){g[1].forEach(function(p){PRICE[p[0]]=p[1]})});
function brl(n){return n==null?'—':Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function catOpts(){return CAT.map(function(g){return '<optgroup label="'+esc(g[0])+'">'+g[1].map(function(p){return '<option value="'+esc(p[0])+'">'+esc(p[0])+' — '+brl(p[1])+'</option>'}).join('')+'</optgroup>'}).join('')}
function updPr(){var p=PRICE[$('pd').value],q=parseInt($('qt').value,10)||0;$('pr').innerHTML='Preço unitário: <b>'+brl(p)+'</b> · Total: <b>'+brl(p*q)+'</b>'}
var ST=['Novo','Em produção','Concluído','Cancelado'];
var sb,user,prof,orders=[],mode='login',timer=null,flt='Todos';
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function fmt(d){return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function setMsg(t,ok){var m=$('msg');if(m){m.textContent=t||'';m.className='msg'+(ok?' ok':'')}}

function renderAuth(){
  clearInterval(timer);
  $('app').innerHTML='<h1>Pedidos de Revenda</h1><p class="s">Entre com seu e-mail para ver e enviar pedidos de qualquer aparelho.</p>'+
  '<div class="tabs"><button id="t1" class="'+(mode==='login'?'on':'')+'">Entrar</button><button id="t2" class="'+(mode==='reg'?'on':'')+'">Criar conta</button></div>'+
  '<div class="card">'+(mode==='reg'?'<label>Nome</label><input id="nm" autocomplete="name">':'')+
  '<label>E-mail</label><input id="em" type="email" autocapitalize="none" autocomplete="email">'+
  '<label>Senha (mín. 6 caracteres)</label><input id="pw" type="password" autocomplete="'+(mode==='reg'?'new-password':'current-password')+'">'+
  '<div class="msg" id="msg"></div><button id="go">'+(mode==='reg'?'Criar conta':'Entrar')+'</button></div>';
  $('t1').onclick=function(){mode='login';renderAuth()};
  $('t2').onclick=function(){mode='reg';renderAuth()};
  $('go').onclick=auth;
}
async function auth(){
  var em=$('em').value.trim().toLowerCase(),pw=$('pw').value,nm=mode==='reg'?$('nm').value.trim():'';
  if(!/^\S+@\S+\.\S+$/.test(em))return setMsg('E-mail inválido.');
  if(pw.length<6)return setMsg('A senha precisa ter ao menos 6 caracteres.');
  $('go').disabled=true;setMsg('Aguarde...',true);
  var r;
  if(mode==='reg'){
    if(!nm){$('go').disabled=false;return setMsg('Informe seu nome.')}
    r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm}}});
    if(!r.error&&!r.data.session){$('go').disabled=false;return setMsg('Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.',true)}
  }else r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){$('go').disabled=false;return setMsg(r.error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':r.error.message)}
  start();
}
async function start(){
  var s=(await sb.auth.getSession()).data.session;
  if(!s)return renderAuth();
  user=s.user;
  var p=await sb.from('profiles').select('name,role').eq('id',user.id).maybeSingle();
  prof=p.data||{name:user.email,role:'user'};
  await loadOrders();renderApp();
  clearInterval(timer);timer=setInterval(refresh,15000);
}
async function loadOrders(){
  var r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(500);
  if(!r.error)orders=r.data;return r.error;
}
async function refresh(){if(!(await loadOrders()))renderList()}
function renderApp(){
  var adm=prof.role==='admin';
  $('app').innerHTML='<div class="top"><div><h1>Olá, '+esc(prof.name)+(adm?'<span class="bd">Admin</span>':'')+'</h1><p class="s" style="margin:0">'+esc(user.email)+'</p></div><button class="g" id="out">Sair</button></div>'+
  '<div class="card"><h2>Novo pedido</h2><div class="grid"><div><label>Revenda</label><input id="rv"></div><div><label>Produto</label><select id="pd">'+catOpts()+'</select></div><div><label>Quantidade</label><input id="qt" type="number" min="1" value="1" inputmode="numeric"></div></div><div class="pr" id="pr"></div>'+
  '<div class="msg" id="msg"></div><button id="add">Enviar pedido</button></div>'+
  '<div class="card"><div class="top" style="margin-bottom:8px"><h2 style="margin:0">'+(adm?'Todos os pedidos':'Meus pedidos')+'</h2><button class="g" id="rf">Atualizar</button></div><div id="lst"></div></div>';
  $('out').onclick=async function(){clearInterval(timer);await sb.auth.signOut();renderAuth()};
  $('add').onclick=addOrder;$('pd').onchange=updPr;$('qt').oninput=updPr;updPr();$('rf').onclick=refresh;
  renderList();
}
function renderList(){
  var adm=prof.role==='admin',el=$('lst');if(!el)return;
  var list=orders.filter(function(o){return flt==='Todos'||o.status===flt});
  var head='';
  if(adm){
    var tq=orders.filter(function(o){return o.status!=='Cancelado'}).reduce(function(t,o){return t+o.qty},0);
    head='<div class="sum"><div><b>'+orders.length+'</b>Pedidos</div><div><b>'+tq+'</b>Unidades</div><div><b>'+brl(orders.filter(function(o){return o.status!=='Cancelado'}).reduce(function(t,o){return t+o.qty*(o.unit_price||0)},0))+'</b>Valor total</div></div>';
  }
  head+='<div class="bar"><select id="fl">'+['Todos'].concat(ST).map(function(x){return '<option'+(x===flt?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div>';
  var rows=list.map(function(o){
    return '<tr><td>'+fmt(o.created_at)+'</td><td><b>'+esc(o.reseller)+'</b></td><td>'+esc(o.product)+'</td><td>'+brl(o.unit_price)+'</td><td>'+o.qty+'</td><td>'+brl(o.unit_price==null?null:o.qty*o.unit_price)+'</td>'+
    (adm?'<td>'+esc(o.owner_name)+'</td><td><select data-st="'+o.id+'">'+ST.map(function(x){return '<option'+(x===o.status?' selected':'')+'>'+x+'</option>'}).join('')+'</select></td><td><button class="g d" data-del="'+o.id+'">Excluir</button></td>':'<td>'+esc(o.status)+'</td>')+'</tr>';
  }).join('');
  el.innerHTML=head+(list.length?'<div class="tw"><table><thead><tr><th>Data</th><th>Revenda</th><th>Produto</th><th>Preço un.</th><th>Qtd</th><th>Total</th>'+(adm?'<th>Enviado por</th><th>Status</th><th></th>':'<th>Status</th>')+'</tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Nenhum pedido.</div>');
  $('fl').onchange=function(){flt=this.value;renderList()};
  Array.prototype.forEach.call(el.querySelectorAll('[data-st]'),function(s){s.onchange=async function(){
    var r=await sb.from('orders').update({status:s.value}).eq('id',s.getAttribute('data-st'));
    if(r.error)alert('Erro: '+r.error.message);refresh()}});
  Array.prototype.forEach.call(el.querySelectorAll('[data-del]'),function(b){b.onclick=async function(){
    if(!confirm('Excluir este pedido?'))return;
    var r=await sb.from('orders').delete().eq('id',b.getAttribute('data-del'));
    if(r.error)alert('Erro: '+r.error.message);refresh()}});
}
async function addOrder(){
  var rv=$('rv').value.trim(),pd=$('pd').value,qt=parseInt($('qt').value,10);
  if(!rv||!pd||!(qt>0))return setMsg('Preencha revenda, produto e quantidade.');
  $('add').disabled=true;
  var r=await sb.from('orders').insert({owner_name:prof.name,reseller:rv,product:pd,unit_price:PRICE[pd],qty:qt});
  $('add').disabled=false;
  if(r.error)return setMsg('Erro ao enviar: '+r.error.message);
  $('rv').value='';$('qt').value='1';setMsg('Pedido enviado!',true);updPr();
  refresh();
}
if(SUPABASE_URL.indexOf('COLE_')===0){
  $('app').innerHTML='<div class="card"><h2>Falta configurar</h2><p class="s">Abra o arquivo index.html e cole a Project URL e a anon key do Supabase no topo do script.</p></div>';
}else{
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  start();
}
</script>
</body>
</html>
