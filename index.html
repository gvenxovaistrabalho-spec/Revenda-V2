<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07061a; --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --txt:#f3f1ff; --mut:#a9a5d1; --p1:#7c5cff; --p2:#00e0ff; --ok:#2ee59d; --warn:#ffb020; --bad:#ff5c7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- fundo 3D ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;perspective:900px}
.bg::before{content:"";position:absolute;inset:-20%;
  background:radial-gradient(600px 400px at 15% 20%,rgba(124,92,255,.45),transparent 60%),
             radial-gradient(500px 400px at 85% 30%,rgba(0,224,255,.30),transparent 60%),
             radial-gradient(600px 500px at 50% 100%,rgba(255,70,160,.25),transparent 60%);
  animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(-4%,3%,0) scale(1.1)}}
.grid3d{position:absolute;left:-50%;right:-50%;bottom:-30%;height:80%;
  background-image:linear-gradient(rgba(124,92,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.35) 1px,transparent 1px);
  background-size:60px 60px;transform:rotateX(68deg);transform-origin:bottom;
  mask-image:linear-gradient(to top,#000 10%,transparent 85%);animation:gridmove 4s linear infinite}
@keyframes gridmove{to{background-position:0 60px}}
.float{position:absolute;perspective:700px;animation:drift var(--t,14s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx,30px),var(--dy,-50px),0)}}
.cube{width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:spin var(--d,20s) linear infinite}
.cube i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.28);
  background:linear-gradient(135deg,rgba(124,92,255,.30),rgba(0,224,255,.12));backdrop-filter:blur(2px)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes spin{from{transform:rotateX(0) rotateY(0)}to{transform:rotateX(360deg) rotateY(360deg)}}

@media (prefers-reduced-motion:reduce){.cube,.grid3d,.float,.bg::before{animation:none!important}}
body.idle .cube,body.idle .grid3d,body.idle .float,body.idle .bg::before{animation-play-state:paused!important}
.searchbar{position:relative}
.searchbar .sicon{position:absolute;left:1rem;pointer-events:none;opacity:.8}
.searchbar input{max-width:520px;padding-left:2.6rem;border-radius:999px}
.badge.cat{background:rgba(0,224,255,.12);color:var(--p2);border-color:rgba(0,224,255,.35)}
.item,.order,.prod-card{content-visibility:auto;contain-intrinsic-size:auto 120px}
/* ---------- vidro + tilt 3D ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.tilt{transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .15s ease-out,box-shadow .3s;position:relative}
.tilt.leave{transition:transform .5s ease}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 60%)}
.tilt:hover::after{opacity:1}
.tilt:hover{box-shadow:0 30px 60px -20px rgba(124,92,255,.45),inset 0 1px 0 rgba(255,255,255,.2)}

/* ---------- botões ---------- */
.btn{border:0;cursor:pointer;padding:.7rem 1.2rem;border-radius:14px;font-weight:600;
  background:linear-gradient(135deg,var(--p1),#5a3df0);color:#fff;
  box-shadow:0 6px 0 #3b25b5,0 14px 24px -6px rgba(124,92,255,.6);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #3b25b5,0 18px 28px -6px rgba(124,92,255,.7)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3b25b5,0 6px 12px -4px rgba(124,92,255,.6)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:0 5px 0 rgba(255,255,255,.08);border:1px solid var(--line)}
.btn.sm{padding:.4rem .7rem;font-size:.8rem;border-radius:10px;box-shadow:0 3px 0 #3b25b5}
.btn.sm.ghost{box-shadow:0 3px 0 rgba(255,255,255,.1)}
.btn.danger{background:linear-gradient(135deg,#ff5c7a,#d62f52);box-shadow:0 5px 0 #8f1b36}
.btn.sm.danger{box-shadow:0 3px 0 #8f1b36}
.btn:disabled{opacity:.5;pointer-events:none}

input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(0,224,255,.18)}
select option{background:#14122e}
label{display:block;font-size:.75rem;color:var(--mut);margin:.8rem 0 .3rem;text-transform:uppercase;letter-spacing:.08em}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.login-card{width:min(420px,100%);padding:2rem}
.hero3d{height:110px;display:grid;place-items:center;perspective:600px;margin-bottom:.5rem}
.hero3d .cube{--s:64px;--d:9s}
.hero3d .cube i{background:linear-gradient(135deg,rgba(124,92,255,.7),rgba(0,224,255,.45));border-color:rgba(255,255,255,.5);display:grid;place-items:center;font-size:1.6rem}
.login-card h1{text-align:center;font-weight:800;font-size:1.6rem}
.login-card p.sub{text-align:center;color:var(--mut);font-size:.85rem;margin-top:.2rem}
.err{color:var(--bad);font-size:.85rem;margin-top:.8rem;min-height:1.2em;text-align:center}

/* ---------- app ---------- */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;
  background:rgba(7,6,26,.65);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:.7rem;font-weight:800}
.logo .mini{perspective:300px;width:30px;height:30px}
.logo .cube{--s:22px;--d:7s;margin:4px}
.sp{flex:1}
.who{font-size:.8rem;color:var(--mut)}
.who b{color:var(--txt)}
nav.tabs{display:flex;gap:.5rem;padding:1rem 1.2rem 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent;box-shadow:0 8px 20px -6px rgba(124,92,255,.7)}
main{padding:1rem 1.2rem 4rem;max-width:1300px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin:1rem 0}
.stat{padding:1rem 1.2rem}
.stat b{display:block;font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 1rem}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:.4rem .9rem;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--mut)}
.chip.on{color:#fff;border-color:var(--p2);background:rgba(0,224,255,.12)}

.mp-head{display:flex;align-items:center;gap:.7rem;margin:2rem 0 .8rem;font-size:1.25rem;font-weight:800}
.mp-dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 16px var(--c)}
.mp-count{font-size:.75rem;font-weight:600;color:var(--mut);border:1px solid var(--line);padding:.15rem .6rem;border-radius:999px}
.slot-head{font-size:.8rem;color:var(--warn);font-weight:600;margin:1rem 0 .5rem;text-transform:uppercase;letter-spacing:.1em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.1rem}
.order{padding:1.1rem 1.2rem;border-left:4px solid var(--c)}
.order h3{font-size:1rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.badge{font-size:.68rem;padding:.15rem .55rem;border-radius:999px;background:rgba(255,176,32,.15);color:var(--warn);border:1px solid rgba(255,176,32,.35);font-weight:600}
.note{font-size:.8rem;color:var(--mut);margin-top:.3rem}
.prog{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:.8rem 0;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--p2));transition:width .4s}
.item{display:grid;grid-template-columns:1fr auto auto;gap:.3rem .7rem;align-items:center;padding:.65rem .7rem;margin-top:.5rem;border-radius:14px;
  background:rgba(0,0,0,.28);border:1px solid var(--line);transform:translateZ(18px);transition:.25s}
.item.ready{background:rgba(46,229,157,.1);border-color:rgba(46,229,157,.4)}
.item .sku{font-weight:800;font-size:1.05rem;letter-spacing:.03em}
.item .sku small{display:block;font-weight:400;font-size:.72rem;color:var(--mut)}
.item .var{grid-column:1;font-size:.8rem;color:var(--p2);margin-top:-.15rem}
.item .qty{font-size:1.5rem;font-weight:800;grid-row:1/3;grid-column:2}
.item .act{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;gap:.35rem;align-items:stretch}
.tog{border:0;cursor:pointer;padding:.55rem .9rem;border-radius:12px;font-weight:700;min-width:104px;
  background:rgba(255,176,32,.18);color:var(--warn);border:1px solid rgba(255,176,32,.4);transition:.2s}
.item.ready .tog{background:linear-gradient(135deg,var(--ok),#10b981);color:#04281b;border-color:transparent;box-shadow:0 6px 18px -4px rgba(46,229,157,.6)}
.tog:active{transform:scale(.94)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.empty{text-align:center;color:var(--mut);padding:3rem 1rem}

/* produção: tela grande e fácil de tocar */
.prod .item{padding:.9rem 1rem}
.prod .item .qty{font-size:2.2rem}
.prod .tog{padding:.9rem 1.1rem;font-size:1rem}

/* ---------- produtos / senhas ---------- */
.two{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:1.2rem;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.pad{padding:1.3rem}
.pad h2{font-size:1.1rem;margin-bottom:.3rem}
.vchips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.vc{background:rgba(124,92,255,.22);border:1px solid rgba(124,92,255,.5);padding:.2rem .6rem;border-radius:999px;font-size:.78rem;display:flex;gap:.4rem;align-items:center}
.vc button{background:none;border:0;cursor:pointer;color:#fff;opacity:.7}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.prod-card{padding:1.1rem}
.prod-card h3{font-size:1.1rem;font-weight:800}
.pwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,2,15,.7);backdrop-filter:blur(8px);display:grid;place-items:center;padding:1rem;overflow:auto}
.modal .box{width:min(640px,100%);max-height:92vh;overflow:auto;padding:1.5rem;background:rgba(20,18,46,.92);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:perspective(900px) rotateX(18deg) translateY(30px) scale(.95)}}
.row{display:grid;grid-template-columns:1.3fr 1fr 90px 36px;gap:.5rem;margin-top:.7rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media(max-width:560px){.row{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);z-index:99;padding:.8rem 1.3rem;border-radius:14px;
  background:#1c1940;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:var(--bad)} #toast.ok{border-color:var(--ok)}
</style>
</head>
<body>
<div class="bg" id="bg"><div class="grid3d"></div></div>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="glass login-card tilt" id="loginForm">
    <div class="hero3d"><div class="cube"><i>📦</i><i>🛒</i><i>🏷️</i><i>🚚</i><i>✨</i><i>📦</i></div></div>
    <h1>Painel de Pedidos</h1>
    <p class="sub">Entre com a sua conta</p>
    <label>Usuário</label>
    <input id="lu" autocomplete="username" placeholder="admin ou producao" required>
    <label>Senha</label>
    <input id="lp" type="password" autocomplete="current-password" placeholder="••••••" required>
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:.6rem" id="lbtn">Entrar</button>
  </form>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header class="top">
    <div class="logo"><div class="mini"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>Painel de Pedidos</div>
    <div class="sp"></div>
    <div class="who">👤 <b id="whoName"></b> · <span id="whoRole"></span></div>
    <button class="btn sm ghost" data-a="logout">Sair</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</section>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ============ CONFIGURAÇÃO: cole aqui os dados do seu Supabase ============ */
const CFG = {
  URL: "https://lnetdehrdbduhibuwgiz.supabase.co",
  KEY: "sb_publishable_t2Fp4PH52x_Fkz93WKPrng_LLiQWFSp"
};
/* ========================================================================== */

const MP = {
  mercado_livre:{n:'Mercado Livre',c:'#ffe600'},
  shopee:{n:'Shopee',c:'#ff5722'},
  tiktok:{n:'TikTok Shop',c:'#25f4ee'},
  magalu:{n:'Magalu',c:'#0086ff'}
};
const SLOTS = ['Hoje manhã','Hoje tarde','Amanhã manhã','Amanhã tarde','Sem horário'];
const S = {sess:null, orders:[], products:[], users:[], tab:'pedidos', mp:'todos', st:'todos', editSku:null, chips:[], cat:'todas', q:'', pcat:'', sig:'', oq:''};
const $ = s => document.querySelector(s);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin = () => S.sess?.role === 'admin';

/* ---------- API (chama as funções do Supabase) ---------- */
async function api(fn, body={}){
  const h = {'apikey':CFG.KEY,'Content-Type':'application/json'};
  if(CFG.KEY.startsWith('eyJ')) h.Authorization = 'Bearer '+CFG.KEY;
  let base = CFG.URL.trim();
  try{ base = new URL(base).origin; }catch{ base = base.replace(/\/+$/,'').replace(/\/rest\/v1.*$/,''); }
  const r = await fetch(`${base}/rest/v1/rpc/${fn}`,{method:'POST',headers:h,body:JSON.stringify(body)});
  const t = await r.text(); let j=null; try{ j = t?JSON.parse(t):null }catch{}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||('Erro '+r.status));
  return j;
}
const call = (fn, extra={}) => api(fn, {p_token:S.sess.token, ...extra});

function toast(msg, type='ok'){
  const t=$('#toast'); t.textContent=msg; t.className='show '+type;
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.className='',2600);
}

/* ---------- fundo 3D ---------- */
(function bg(){
  const el=$('#bg');
  const defs=[[70,'8%','18%',22,'40px','-60px',16],[40,'85%','12%',16,'-30px','50px',12],[110,'78%','60%',30,'-50px','-40px',18],
              [50,'12%','68%',18,'40px','30px',14],[28,'45%','8%',12,'20px','60px',10],[60,'55%','78%',24,'-30px','-50px',15]];
  defs.forEach(([s,l,t,d,dx,dy,tt])=>{
    const f=document.createElement('div'); f.className='float';
    f.style.cssText=`left:${l};top:${t};--dx:${dx};--dy:${dy};--t:${tt}s`;
    f.innerHTML=`<div class="cube" style="--s:${s}px;--d:${d}s"><i></i><i></i><i></i><i></i><i></i><i></i></div>`;
    el.appendChild(f);
  });
})();

document.addEventListener('visibilitychange',()=>document.body.classList.toggle('idle',document.hidden));

/* ---------- tilt 3D nos cards ---------- */
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse') return;
  const el=e.target.closest?.('.tilt'); if(!el) return;
  const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  el.classList.remove('leave');
  el.style.setProperty('--ry',((x-.5)*10).toFixed(2)+'deg');
  el.style.setProperty('--rx',((.5-y)*10).toFixed(2)+'deg');
  el.style.setProperty('--mx',(x*100)+'%'); el.style.setProperty('--my',(y*100)+'%');
});
document.addEventListener('pointerout',e=>{
  const el=e.target.closest?.('.tilt'); if(!el||el.contains(e.relatedTarget)) return;
  el.classList.add('leave'); el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg');
});

/* ---------- sessão ---------- */
async function boot(){
  if(CFG.URL.startsWith('COLE_')){ $('#login').classList.remove('hidden'); $('#lerr').textContent='Falta configurar URL e KEY do Supabase no topo do index.html'; return; }
  try{ S.sess = JSON.parse(localStorage.getItem('pp_sess')||'null'); }catch{ S.sess=null }
  if(S.sess){
    try{ const me = await call('get_session'); S.sess.role=me.role; S.sess.username=me.username; return enterApp(); }
    catch{ localStorage.removeItem('pp_sess'); S.sess=null; }
  }
  $('#login').classList.remove('hidden');
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('#lerr').textContent=''; $('#lbtn').disabled=true;
  try{
    const r = await api('login',{p_username:$('#lu').value,p_password:$('#lp').value});
    S.sess=r; localStorage.setItem('pp_sess',JSON.stringify(r)); $('#lp').value=''; enterApp();
  }catch(err){ $('#lerr').textContent=err.message; }
  $('#lbtn').disabled=false;
});
async function enterApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#whoName').textContent=S.sess.username; $('#whoRole').textContent=isAdmin()?'Administrador':'Produção';
  S.tab = isAdmin()?'pedidos':'producao';
  renderTabs(); await loadAll(); render();
  clearInterval(enterApp.h); enterApp.h=setInterval(async()=>{ if(document.hidden||document.querySelector('#modalRoot .modal')||document.activeElement?.id==='oSearch') return; const old=S.sig; await loadOrders(); if(S.sig!==old && (S.tab==='pedidos'||S.tab==='producao')) render(); },8000);
}
async function logout(){
  try{ await call('logout'); }catch{}
  localStorage.removeItem('pp_sess'); S.sess=null; clearInterval(enterApp.h);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
}

/* ---------- dados ---------- */
async function loadOrders(){ try{ const o = await call('list_orders'); const sig=JSON.stringify(o); if(sig!==S.sig){ S.sig=sig; S.orders=o; } }catch(e){ if(/Sess/.test(e.message)) logout(); } }
async function loadAll(){
  await loadOrders();
  if(isAdmin()){ try{ S.products = await call('list_products'); }catch{} }
}

/* ---------- abas ---------- */
function renderTabs(){
  const tabs = isAdmin()
    ? [['pedidos','📦 Pedidos'],['produtos','🏷️ Produtos'],['senhas','🔑 Senhas']]
    : [['producao','🏭 Produção']];
  $('#tabs').innerHTML = tabs.map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${n}</button>`).join('');
}
function render(){
  renderTabs();
  const v=$('#view');
  if(S.tab==='pedidos'||S.tab==='producao') v.innerHTML = ordersView();
  else if(S.tab==='produtos') v.innerHTML = productsView();
  else if(S.tab==='senhas') v.innerHTML = passwordsView();
}

/* ---------- pedidos / produção ---------- */
function ordersView(){
  const prod = !isAdmin();
  const all = S.orders;
  const items = all.flatMap(o=>o.items);
  const pend = items.filter(i=>!i.ready).length, done = items.length-pend;
  const pendQty = items.filter(i=>!i.ready).reduce((a,i)=>a+i.quantity,0);
  const oq = S.oq.trim().toLowerCase();
  const cats = [...new Set(items.map(i=>i.category).filter(Boolean))].sort();
  let list = all.filter(o=> S.mp==='todos'||o.marketplace===S.mp)
                .filter(o=> S.cat==='todas' || o.items.some(i=>i.category===S.cat))
                .filter(o=> !oq || (o.order_code||'').toLowerCase().includes(oq) || String(o.id)===oq || o.items.some(i=>matchItem(i,oq)))
                .filter(o=> S.st==='todos' || (S.st==='pend'? o.items.some(i=>!i.ready) : o.items.length&&o.items.every(i=>i.ready)));
  const chips = ['todos',...Object.keys(MP)].map(k=>{
    const n = k==='todos'?all.length:all.filter(o=>o.marketplace===k).length;
    return `<button class="chip ${S.mp===k?'on':''}" data-a="fmp" data-v="${k}">${k==='todos'?'Todos':MP[k].n} · ${n}</button>`;
  }).join('');
  const catChips = cats.length>1 ? ['todas',...cats].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="fcat" data-v="${esc(c)}">${c==='todas'?'Todas categorias':esc(c)}</button>`).join('') : '';
  const sts = [['todos','Todos'],['pend','Pendentes'],['feito','Prontos']].map(([k,n])=>`<button class="chip ${S.st===k?'on':''}" data-a="fst" data-v="${k}">${n}</button>`).join('');
  let html = `<div class="stats">
    <div class="glass stat tilt"><b>${pend}</b><span>Itens pendentes</span></div>
    <div class="glass stat tilt"><b>${pendQty}</b><span>Peças a produzir</span></div>
    <div class="glass stat tilt"><b>${done}</b><span>Itens prontos</span></div>
    <div class="glass stat tilt"><b>${all.length}</b><span>Pedidos</span></div></div>
    <div class="bar searchbar"><span class="sicon">🔎</span><input id="oSearch" type="search" placeholder="Pesquisar por SKU, nome, cor ou nº do pedido…" value="${esc(S.oq)}" autocomplete="off">${S.oq?'<button class="btn sm ghost" data-a="clearSearch">Limpar</button>':''}</div>
    <div class="bar">${chips}</div>
    ${catChips?`<div class="bar">${catChips}</div>`:''}
    <div class="bar">${sts}<div class="sp"></div>${prod?'':'<button class="btn" data-a="newOrder">＋ Novo pedido</button>'}</div>`;
  if(!list.length) html += `<div class="empty">Nenhum pedido por aqui ainda.</div>`;
  for(const k of Object.keys(MP)){
    const os = list.filter(o=>o.marketplace===k); if(!os.length) continue;
    html += `<div class="mp-head" style="--c:${MP[k].c}"><span class="mp-dot"></span>${MP[k].n}<span class="mp-count">${os.length} pedido${os.length>1?'s':''}</span></div>`;
    for(const sl of SLOTS){
      const g = os.filter(o=>o.slot===sl).sort((a,b)=>a.id-b.id); if(!g.length) continue;
      if(sl!=='Sem horário') html += `<div class="slot-head">⏰ ${sl}</div>`;
      html += `<div class="cards ${prod?'prod':''}">${g.map(o=>orderCard(o,k,prod)).join('')}</div>`;
    }
  }
  return html;
}
function matchItem(i,q){ return (i.sku||'').toLowerCase().includes(q)||(i.name||'').toLowerCase().includes(q)||(i.variation||'').toLowerCase().includes(q); }
function orderCard(o,k,prod){
  const done=o.items.filter(i=>i.ready).length, pct=o.items.length?Math.round(done/o.items.length*100):0;
  return `<div class="glass order tilt" style="--c:${MP[k].c}">
    <h3>${o.order_code?esc(o.order_code):'Pedido #'+o.id} ${o.slot!=='Sem horário'?`<span class="badge">${esc(o.slot)}</span>`:''}</h3>
    ${o.notes?`<div class="note">📝 ${esc(o.notes)}</div>`:''}
    <div class="prog"><i style="width:${pct}%"></i></div>
    ${o.items.filter(i=>(S.cat==='todas'||i.category===S.cat)&&(!S.oq.trim()||matchItem(i,S.oq.trim().toLowerCase())||(o.order_code||'').toLowerCase().includes(S.oq.trim().toLowerCase())||String(o.id)===S.oq.trim())).map(i=>`<div class="item ${i.ready?'ready':''}">
      <div class="sku">${esc(i.sku)}<small>${esc(i.name)}</small></div>
      <div class="var">${i.variation?esc(i.variation):''}</div>
      <div class="qty">×${i.quantity}</div>
      <div class="act">
        <button class="tog" data-a="ready" data-id="${i.id}" data-v="${!i.ready}">${i.ready?'✔ Pronto':'Pendente'}</button>
        ${prod?'':`<div style="display:flex;gap:.3rem"><button class="btn sm ghost" data-a="editItem" data-id="${i.id}" data-q="${i.quantity}" title="Editar quantidade">✎</button><button class="btn sm danger" data-a="delItem" data-id="${i.id}" title="Remover item">✕</button></div>`}
      </div></div>`).join('')}
    ${prod?'':`<div class="tools"><button class="btn sm ghost" data-a="addItem" data-id="${o.id}">＋ Item</button><button class="btn sm danger" data-a="delOrder" data-id="${o.id}">Excluir pedido</button></div>`}
  </div>`;
}

/* ---------- modal de pedido ---------- */
function openOrderModal(orderId=null){
  if(!S.products.length){ toast('Cadastre produtos (SKU) primeiro na aba Produtos','bad'); return; }
  const add = orderId!==null;
  $('#modalRoot').innerHTML = `<div class="modal" data-a="closeModal"><div class="glass box">
    <h2>${add?'Adicionar item':'Novo pedido'}</h2>
    ${add?'':`<div class="row2">
      <div><label>Marketplace</label><select id="mMp">${Object.entries(MP).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select></div>
      <div><label>Entrega / coleta</label><select id="mSlot">${SLOTS.map(s=>`<option ${s==='Amanhã tarde'?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <label>Código do pedido (opcional)</label><input id="mCode" placeholder="Ex: 2000012345678">
    <label>Observação (opcional)</label><input id="mNotes" placeholder="Ex: embalar separado">`}
    <label>Itens</label>
    <div id="mRows"></div>
    <button class="btn sm ghost" style="margin-top:.7rem" data-a="rowAdd">＋ Mais um item</button>
    <div style="display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.4rem">
      <button class="btn ghost" data-a="closeModal">Cancelar</button>
      <button class="btn" data-a="saveOrder" data-id="${add?orderId:''}">Salvar</button>
    </div></div></div>`;
  addRow();
}
const prodCats = () => [...new Set(S.products.map(p=>p.category).filter(Boolean))].sort();
function skuOptions(cat){
  const list = cat ? S.products.filter(p=>p.category===cat) : S.products;
  return '<option value="">SKU…</option>'+list.map(p=>`<option value="${esc(p.sku)}">${esc(p.sku)}${p.name?' — '+esc(p.name):''}</option>`).join('');
}
function addRow(){
  const d=document.createElement('div'); d.className='row';
  const cats=prodCats();
  d.innerHTML = `${cats.length>1?`<select class="rCat" style="grid-column:1/-1"><option value="">Todas as categorias</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:''}
    <select class="rSku">${skuOptions('')}</select>
    <select class="rVar"><option value="">Variação</option></select>
    <input class="rQty" type="number" min="1" value="1">
    <button class="btn sm danger" data-a="rowDel" type="button">✕</button>`;
  $('#mRows').appendChild(d);
}
document.addEventListener('change',e=>{
  if(e.target.classList.contains('rCat')){ e.target.closest('.row').querySelector('.rSku').innerHTML=skuOptions(e.target.value); e.target.closest('.row').querySelector('.rVar').innerHTML='<option value="">Variação</option>'; return; }
  if(!e.target.classList.contains('rSku')) return;
  const p=S.products.find(x=>x.sku===e.target.value), sel=e.target.closest('.row').querySelector('.rVar');
  sel.innerHTML = p&&p.variations.length ? p.variations.map(v=>`<option>${esc(v)}</option>`).join('') : '<option value="">Único</option>';
});
function collectRows(){
  return [...document.querySelectorAll('#mRows .row')].map(r=>({
    sku:r.querySelector('.rSku').value, variation:r.querySelector('.rVar').value, quantity:parseInt(r.querySelector('.rQty').value)||0
  })).filter(i=>i.sku&&i.quantity>0);
}

/* ---------- produtos ---------- */
function productsView(){
  const e = S.products.find(p=>p.sku===S.editSku);
  return `<div class="two">
   <div class="glass pad tilt">
     <h2>${e?'Editar produto':'Novo produto'}</h2>
     <label>SKU</label><input id="pSku" value="${esc(e?.sku||'')}" ${e?'readonly':''} placeholder="Ex: CAMA-GG">
     <label>Nome (opcional)</label><input id="pName" value="${esc(e?.name||'')}" placeholder="Ex: Cama Pet GG">
     <label>Categoria</label>
     <select id="pCat">${['Cama','Colchão fibra'].map(c=>`<option ${((e?.category)||S.pcat||'Cama')===c?'selected':''}>${c}</option>`).join('')}</select>
     <label>Variações (cor / tipo)</label>
     <input id="pVar" placeholder="Digite e aperte Enter (ex: Branco)">
     <div class="vchips" id="pChips"></div>
     <div style="display:flex;gap:.6rem;margin-top:1.2rem">
       <button class="btn" data-a="saveProduct">Salvar</button>
       ${e?'<button class="btn ghost" data-a="cancelEdit">Cancelar</button>':''}
     </div>
   </div>
   <div>
     <div class="bar"><input id="pSearch" placeholder="🔎 Buscar SKU ou nome…" value="${esc(S.q)}" style="max-width:340px">
       ${['','Cama','Colchão fibra'].map(c=>`<button class="chip ${S.pcat===c?'on':''}" data-a="pfilter" data-v="${c}">${c||'Todos'}</button>`).join('')}
       <span class="note" style="margin:0">${filteredProducts().length} produtos</span></div>
     <div class="pgrid">${filteredProducts().slice(0,60).map(p=>`<div class="glass prod-card tilt">
      <h3>${esc(p.sku)} ${p.category?`<span class="badge cat">${esc(p.category)}</span>`:''}</h3><div class="note">${esc(p.name)||'—'}</div>
      <div class="vchips">${p.variations.map(v=>`<span class="vc">${esc(v)}</span>`).join('')||'<span class="note">sem variações</span>'}</div>
      <div class="tools"><button class="btn sm ghost" data-a="editProduct" data-id="${esc(p.sku)}">Editar</button>
      <button class="btn sm danger" data-a="delProduct" data-id="${esc(p.sku)}">Excluir</button></div></div>`).join('')
      || '<div class="empty">Nenhum produto ainda.</div>'}</div>
      ${filteredProducts().length>60?'<div class="note" style="text-align:center;margin-top:1rem">Mostrando 60 — use a busca para achar os outros.</div>':''}</div></div>`;
}
function filteredProducts(){
  const q=S.q.trim().toLowerCase();
  return S.products.filter(p=>(!S.pcat||p.category===S.pcat)&&(!q||p.sku.toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q)));
}
let _ot; document.addEventListener('input',e=>{
  if(e.target.id!=='oSearch') return; clearTimeout(_ot);
  _ot=setTimeout(()=>{ S.oq=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#oSearch'); if(i){ i.focus(); i.setSelectionRange(pos,pos);} },200);
});
let _st; document.addEventListener('input',e=>{
  if(e.target.id!=='pSearch') return; clearTimeout(_st);
  _st=setTimeout(()=>{ S.q=e.target.value; const pos=e.target.selectionStart; render(); drawChips(); const i=$('#pSearch'); if(i){ i.focus(); i.setSelectionRange(pos,pos);} },250);
});
function drawChips(){
  const c=$('#pChips'); if(!c) return;
  c.innerHTML = S.chips.map((v,i)=>`<span class="vc">${esc(v)}<button data-a="chipDel" data-v="${i}">✕</button></span>`).join('');
}
document.addEventListener('keydown',e=>{
  if(e.target.id==='pVar' && (e.key==='Enter'||e.key===',')){
    e.preventDefault(); const v=e.target.value.trim().replace(/,$/,'');
    if(v && !S.chips.includes(v)) S.chips.push(v); e.target.value=''; drawChips();
  }
});

/* ---------- senhas ---------- */
function passwordsView(){
  return `<div class="pwgrid">${S.users.map(u=>`<div class="glass pad tilt">
    <h2>${u.role==='admin'?'👑 Conta Admin':'🏭 Conta Produção'}</h2><div class="note">usuário: <b>${esc(u.username)}</b></div>
    <label>Nova senha</label><input type="password" id="pw1-${esc(u.username)}" autocomplete="new-password">
    <label>Repetir senha</label><input type="password" id="pw2-${esc(u.username)}" autocomplete="new-password">
    <button class="btn" style="margin-top:1.2rem" data-a="savePw" data-id="${esc(u.username)}">Salvar senha</button></div>`).join('')
    || '<div class="empty">Carregando…</div>'}</div>`;
}

/* ---------- ações (cliques) ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id, v=b.dataset.v;
  try{
    switch(a){
      case 'logout': return logout();
      case 'tab':
        S.tab=v; if(v==='senhas') S.users = await call('list_users');
        if(v==='produtos'){ S.editSku=null; S.chips=[]; S.q=''; S.pcat=''; S.products=await call('list_products'); }
        render(); if(v==='produtos') drawChips(); return;
      case 'fmp': S.mp=v; return render();
      case 'fst': S.st=v; return render();
      case 'fcat': S.cat=v; return render();
      case 'clearSearch': S.oq=''; return render();
      case 'newOrder': return openOrderModal();
      case 'addItem': return openOrderModal(+id);
      case 'closeModal': if(e.target===b||b.classList.contains('btn')) $('#modalRoot').innerHTML=''; return;
      case 'rowAdd': return addRow();
      case 'rowDel': if(document.querySelectorAll('#mRows .row').length>1) b.closest('.row').remove(); return;
      case 'saveOrder': {
        const items=collectRows(); if(!items.length) return toast('Escolha o SKU e a quantidade','bad');
        if(id){ for(const i of items) await call('add_item',{p_order_id:+id,p_sku:i.sku,p_variation:i.variation,p_quantity:i.quantity}); }
        else await call('create_order',{p_marketplace:$('#mMp').value,p_slot:$('#mSlot').value,p_code:$('#mCode').value,p_notes:$('#mNotes').value,p_items:items});
        $('#modalRoot').innerHTML=''; toast('Salvo!'); await loadOrders(); return render();
      }
      case 'ready': {
        const val = v==='true';
        for(const o of S.orders) for(const i of o.items) if(i.id==id) i.ready=val;
        render(); await call('set_item_ready',{p_item_id:+id,p_ready:val}); return;
      }
      case 'editItem': {
        const q=prompt('Nova quantidade:',b.dataset.q); if(q===null) return;
        const n=parseInt(q); if(!(n>0)) return toast('Quantidade inválida','bad');
        await call('update_item',{p_item_id:+id,p_variation:null,p_quantity:n}); await loadOrders(); return render();
      }
      case 'delItem': if(!confirm('Remover este item?')) return;
        await call('delete_item',{p_item_id:+id}); await loadOrders(); return render();
      case 'delOrder': if(!confirm('Excluir o pedido inteiro?')) return;
        await call('delete_order',{p_order_id:+id}); await loadOrders(); return render();
      case 'saveProduct': {
        const pend=$('#pVar').value.trim(); if(pend && !S.chips.includes(pend)) S.chips.push(pend);
        await call('upsert_product',{p_sku:$('#pSku').value,p_name:$('#pName').value,p_variations:S.chips,p_category:$('#pCat').value});
        S.editSku=null; S.chips=[]; S.products=await call('list_products'); toast('Produto salvo'); render(); return drawChips();
      }
      case 'editProduct': S.editSku=id; S.chips=[...(S.products.find(p=>p.sku===id)?.variations||[])]; render(); return drawChips();
      case 'pfilter': S.pcat=v; render(); return drawChips();
      case 'cancelEdit': S.editSku=null; S.chips=[]; render(); return drawChips();
      case 'delProduct': if(!confirm('Excluir o produto '+id+'? (pedidos antigos continuam)')) return;
        await call('delete_product',{p_sku:id}); S.products=await call('list_products'); render(); return drawChips();
      case 'chipDel': S.chips.splice(+v,1); return drawChips();
      case 'savePw': {
        const p1=$('#pw1-'+id).value, p2=$('#pw2-'+id).value;
        if(p1!==p2) return toast('As senhas não conferem','bad');
        await call('change_password',{p_username:id,p_new:p1});
        $('#pw1-'+id).value=''; $('#pw2-'+id).value=''; return toast('Senha alterada!');
      }
    }
  }catch(err){ toast(err.message,'bad'); if(a==='ready') { await loadOrders(); render(); } }
});

boot();
</script>
</body>
</html>
